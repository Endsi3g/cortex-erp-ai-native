name: Security & Vulnerability Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 1' # Weekly on Monday at 04:00 UTC

jobs:
  python-dependency-audit:
    name: Python Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit pydantic httpx

      - name: Audit installed dependencies
        run: pip-audit --strict || echo "::warning title=pip-audit::Audit warnings reported."

  secret-detection:
    name: Secret & Credential Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Hardcoded Secrets or Credentials
        run: |
          echo "Scanning repository for potential committed secrets..."
          if git ls-files | grep -E "(^|/)\.env$|\.pem$|\.key$|id_rsa"; then
            echo "::error title=Secret Leak::Committed environment or private key file detected!"
            exit 1
          fi
          echo "✓ No unauthorized sensitive files found in tree."

      - name: Check for high-entropy / obviously live secrets in tracked text files
        run: |
          if git grep -InE "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----)" -- . ':!*.md'; then
            echo "::error title=Secret Leak::A likely live credential pattern was found in a tracked file."
            exit 1
          fi
          echo "✓ No obvious live-credential patterns found."
