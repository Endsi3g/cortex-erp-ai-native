name: Security & Vulnerability Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 1' # Weekly on Monday at 04:00 UTC

jobs:
  composer-audit:
    name: Composer Dependencies Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Audit Core Dependencies
        working-directory: ./apps/cortex-core
        run: |
          if [ -f "composer.lock" ]; then
            composer audit || echo "::warning title=Composer Audit::Audit warnings reported."
          fi

      - name: Audit Plugin Dependencies
        working-directory: ./plugins/Webkul/CortexRental
        run: |
          if [ -f "composer.lock" ]; then
            composer audit || echo "::warning title=Composer Audit::Audit warnings reported."
          fi

  secret-detection:
    name: Secret & Credential Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Hardcoded Secrets or Credentials
        run: |
          echo "Scanning repository for potential committed secrets..."
          # Verify that no .env with real secrets is committed
          if git ls-files | grep -E "(^\.env$|\.pem$|\.key$)"; then
            echo "::error title=Secret Leak::Committed environment or private key file detected!"
            exit 1
          fi
          echo "✓ No unauthorized sensitive files found in tree."
