name: Cortex CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-and-tests:
    name: Python 3.11 — Ruff, DocType schema check & pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pydantic httpx

      - name: Ruff — correctness rules (F, E9)
        run: ruff check --config ruff.toml apps/

      - name: Ruff — format check
        run: ruff format --config ruff.toml --check apps/

      - name: DocType JSON schema sanity check
        run: |
          python -c "
          import json, glob, sys
          doctypes = glob.glob('apps/cortex_rental/**/doctype/*/*.json', recursive=True)
          print(f'Checking {len(doctypes)} DocType JSON definitions...')
          for dt in doctypes:
              with open(dt) as f:
                  data = json.load(f)
              assert 'doctype' in data or 'fields' in data, dt
          print(f'OK: {len(doctypes)} DocTypes validated.')
          "

      - name: Run test suite (pytest)
        env:
          PYTHONPATH: apps/cortex_rental:apps/cortex-mcp
        run: pytest apps/ -v

  pre-claude-check-script:
    name: Shell & Workflow Validation (pre-claude-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pydantic httpx

      - name: Make Script Executable & Run
        run: |
          chmod +x ./bin/pre-claude-check.sh
          ./bin/pre-claude-check.sh
