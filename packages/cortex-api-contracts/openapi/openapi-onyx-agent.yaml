openapi: 3.1.0
info:
  title: Cortex Rental Agent API
  version: 1.0.0
  description: |
    Spécification stricte d'API réservée aux agents Onyx et au serveur MCP Cortex.
    Toute mutation sensible crée des brouillons ou des demandes d'approbation humaine.
servers:
  - url: http://localhost:8080/api/v1/cortex-agent
    description: Serveur Agent Cortex Local
  - url: http://localhost:8080/api/v1/cortex
    description: API Cortex Standard
paths:
  /items:
    get:
      operationId: searchRentalItems
      summary: Rechercher et lister les équipements du catalogue
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Liste des équipements
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RentalItem'

  /items/{item}:
    get:
      operationId: getRentalItem
      summary: Consulter la fiche d'un équipement
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Détail de l'équipement
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/RentalItem'

  /availability/check:
    post:
      operationId: checkAvailability
      summary: Vérifier la disponibilité de matériel sur une période calendaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityCheckRequest'
      responses:
        '200':
          description: Résultat de disponibilité calculé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityCheckResponse'

  /transactions/{transaction}:
    get:
      operationId: getRentalTransaction
      summary: Consulter une transaction de location
      parameters:
        - name: transaction
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Détail de la transaction
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/RentalTransaction'

  /quotes/drafts:
    post:
      operationId: createQuoteDraft
      summary: Créer un brouillon de soumission (quote) sans blocage d'inventaire
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteDraftRequest'
      responses:
        '201':
          description: Brouillon créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDraftResponse'

  /approvals:
    post:
      operationId: submitApprovalRequest
      summary: Déposer une demande d'approbation d'action sensible
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitApprovalRequest'
      responses:
        '201':
          description: Demande d'approbation enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResponse'

components:
  schemas:
    RentalItem:
      type: object
      required:
        - id
        - code
        - name
        - is_serialized
        - total_quantity
        - daily_rate
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        category:
          type: string
          nullable: true
        is_serialized:
          type: boolean
        total_quantity:
          type: integer
        daily_rate:
          type: string
        weekly_rate:
          type: string
          nullable: true
        monthly_rate:
          type: string
          nullable: true

    AvailabilityCheckRequest:
      type: object
      required:
        - starts_at
        - ends_at
        - items
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required:
              - item_id
              - quantity
            properties:
              item_id:
                type: string
                format: uuid
              quantity:
                type: number

    AvailabilityCheckResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              item_id:
                type: string
                format: uuid
              item_code:
                type: string
              requested_quantity:
                type: number
              available_quantity:
                type: number
              is_available:
                type: boolean
              conflicts:
                type: array
                items:
                  type: object
              suggested_serial_numbers:
                type: array
                items:
                  type: object
        meta:
          type: object
          properties:
            starts_at:
              type: string
            ends_at:
              type: string
            items_count:
              type: integer

    RentalTransaction:
      type: object
      required:
        - id
        - number
        - customer_id
        - state
        - starts_at
        - ends_at
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        customer_id:
          type: string
          format: uuid
        state:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    CreateQuoteDraftRequest:
      type: object
      required:
        - starts_at
        - ends_at
        - lines
      properties:
        customer_id:
          type: string
          format: uuid
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - item_id
              - quantity
            properties:
              item_id:
                type: string
                format: uuid
              quantity:
                type: number
              unit_rate:
                type: number
              discount_percentage:
                type: number
              client_description:
                type: string
        notes:
          type: string
        evidence_ids:
          type: array
          items:
            type: string

    QuoteDraftResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - number
            - state
            - starts_at
            - ends_at
            - pricing
          properties:
            id:
              type: string
              format: uuid
            number:
              type: string
            state:
              type: string
              example: quote
            starts_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
            pricing:
              type: object
              properties:
                subtotal:
                  type: string
                discount_total:
                  type: string
                tax_total:
                  type: string
                total:
                  type: string

    SubmitApprovalRequest:
      type: object
      required:
        - action
        - entity_type
        - entity_id
      properties:
        action:
          type: string
          example: rental.quote.transition_to_reservation
        entity_type:
          type: string
          example: rental_transaction
        entity_id:
          type: string
          format: uuid
        proposed_payload:
          type: object
        evidence_ids:
          type: array
          items:
            type: string
        policy_decision:
          type: object

    ApprovalRequestResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - action
            - entity_type
            - entity_id
            - status
          properties:
            id:
              type: string
              format: uuid
            action:
              type: string
            entity_type:
              type: string
            entity_id:
              type: string
              format: uuid
            requested_by_type:
              type: string
            requested_by_id:
              type: string
            status:
              type: string
              example: pending
            created_at:
              type: string
              format: date-time
