[project]
name = "cortex_rental"
authors = [
    { name = "Cortex Architecture Team", email = "architecture@cortex.local"}
]
description = "Cortex AI-Native Rental & Consignment Domain App for Frappe & ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed in Frappe environment
    "jsonschema~=4.0",  # Used by services/extraction.py to validate the intake extraction schema; degrades to a minimal built-in check if absent.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "cortex_rental/tests",
]
