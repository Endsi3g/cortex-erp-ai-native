[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-mcp"
version = "1.0.0"
description = "Cortex AI-Native FastMCP Private Facade for Onyx Agents & Frappe ERPNext"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Cortex AI-Native ERP Team", email = "architecture@cortex.local" }
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "uvicorn>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
