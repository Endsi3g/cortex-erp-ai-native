; Processus de production d'un bench Cortex (remplacer /home/frappe/frappe-bench et l'utilisateur au besoin).
; `bench setup supervisor` en génère une version équivalente.
[program:cortex-web]
command=/home/frappe/frappe-bench/env/bin/gunicorn -b 127.0.0.1:8000 -w 4 --threads 2 -t 120 --max-requests 2000 --max-requests-jitter 200 --graceful-timeout 30 frappe.app:application --preload
directory=/home/frappe/frappe-bench/sites
user=frappe
autorestart=true
stopwaitsecs=40
stdout_logfile=/home/frappe/frappe-bench/logs/web.log
stderr_logfile=/home/frappe/frappe-bench/logs/web.error.log

[program:cortex-worker-short]
command=/home/frappe/frappe-bench/env/bin/bench worker --queue short,default
directory=/home/frappe/frappe-bench
user=frappe
autorestart=true
stopwaitsecs=300

[program:cortex-worker-long]
command=/home/frappe/frappe-bench/env/bin/bench worker --queue long
directory=/home/frappe/frappe-bench
user=frappe
autorestart=true
stopwaitsecs=1500

[program:cortex-scheduler]
command=/home/frappe/frappe-bench/env/bin/bench schedule
directory=/home/frappe/frappe-bench
user=frappe
autorestart=true

[program:cortex-socketio]
command=node /home/frappe/frappe-bench/apps/frappe/socketio.js
directory=/home/frappe/frappe-bench
user=frappe
autorestart=true
