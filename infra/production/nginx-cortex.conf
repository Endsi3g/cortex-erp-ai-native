# Cortex : reverse proxy devant gunicorn (Frappe) et le serveur de sockets, avec TLS et zones de débit.
# `bench setup nginx` génère une base équivalente; ce fichier ajoute les protections propres à Cortex.
# Remplacer app.exemple.ca, les chemins des certificats et le chemin du bench.

limit_req_zone $binary_remote_addr zone=cortex_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cortex_public:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=cortex_api:10m rate=600r/m;
limit_conn_zone $binary_remote_addr zone=cortex_conn:10m;

upstream cortex_web { server 127.0.0.1:8000 fail_timeout=0; }
upstream cortex_socket { server 127.0.0.1:9000 fail_timeout=0; }

server {
    listen 80;
    server_name app.exemple.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.exemple.ca;

    ssl_certificate     /etc/letsencrypt/live/app.exemple.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.exemple.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /home/frappe/frappe-bench/sites;
    client_max_body_size 10m;          # aligné sur max_file_size (logo 2 Mo, photo 5 Mo)
    client_body_timeout 30s;
    keepalive_timeout 30s;
    limit_conn cortex_conn 40;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets {
        alias /home/frappe/frappe-bench/sites/assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/protected/(.*) {
        internal;
        alias /home/frappe/frappe-bench/sites/$host/$1;
    }

    location /socket.io {
        proxy_pass http://cortex_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $scheme://$http_host;
        proxy_read_timeout 600s;
    }

    # Connexion : 10 essais par minute et par adresse.
    location = /api/method/login {
        limit_req zone=cortex_login burst=5 nodelay;
        include /etc/nginx/cortex-proxy.conf;
    }

    # Appels publics (demande d'accès, portail de devis, santé, webhook Stripe).
    location ~ ^/(devis|api/method/cortex_rental\.api\.v1\.(access|quote_share|health)\.) {
        limit_req zone=cortex_public burst=30 nodelay;
        include /etc/nginx/cortex-proxy.conf;
    }

    location /api/ {
        limit_req zone=cortex_api burst=200 nodelay;
        include /etc/nginx/cortex-proxy.conf;
    }

    location / {
        include /etc/nginx/cortex-proxy.conf;
    }
}
