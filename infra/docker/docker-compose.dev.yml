# ==============================================================================
# CORTEX ERP AI-NATIVE — LOCAL DEVELOPMENT DOCKER COMPOSE STACK
# ==============================================================================
# PRD IDs: PRD-ARCH-001, PRD-NFR-001, PRD-AI-001
# Architecture: Frappe Framework / ERPNext + MariaDB 10.11 + FastMCP Python
# ==============================================================================

services:
  # --- 1. Base de Données Transactionnelle (MariaDB 10.11+ Standard Frappe) ---
  mariadb:
    image: mariadb:10.11
    container_name: cortex_mariadb_dev
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-storage-engine=InnoDB
      - --max_allowed_packet=64M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cortex_root_dev_password}
      MYSQL_DATABASE: ${DB_DATABASE:-_cortex_dev}
      MYSQL_USER: ${DB_USERNAME:-cortex_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cortex_local_dev_password_only}
    ports:
      - "127.0.0.1:3306:3306" # Local DX only
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- 2. Cache, Queues & Verrous Atomiques (Valkey 8 / Redis) ---
  valkey:
    image: valkey/valkey:8.0.2-alpine
    container_name: cortex_valkey_dev
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379" # Local DX only
    volumes:
      - valkey_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # --- 3. Stockage Objets, Preuves d'Audit & Fichiers (MinIO) ---
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: cortex_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-cortex_minio_admin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-cortex_minio_dev_secret_key}
    ports:
      - "127.0.0.1:9000:9000" # MinIO API (Local DX only)
      - "127.0.0.1:9001:9001" # MinIO Web Console (DX)
    volumes:
      - minio_data:/data
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- 4. Serveur Mail de Développement & Sandbox (Mailpit) ---
  mailpit:
    image: axllent/mailpit:v1.22.4
    container_name: cortex_mailpit_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP Port
      - "127.0.0.1:8025:8025" # Web UI
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # --- 5. Application Frappe Bench / ERPNext Core ---
  bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    container_name: cortex_bench_dev
    restart: unless-stopped
    ports:
      - "8000:8000" # Frappe Desk Web UI
      - "9000:9000" # SocketIO WebSockets
    volumes:
      - ../../apps/cortex_rental:/home/frappe/frappe-bench/apps/cortex_rental
      - bench_sites:/home/frappe/frappe-bench/sites
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_TYPE: mariadb
      REDIS_CACHE: redis://valkey:6379/0
      REDIS_QUEUE: redis://valkey:6379/1
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - internal
      - public

  # --- 6. Façade Serveur MCP Python (FastMCP / Python 3.12) ---
  mcp:
    image: python:3.12-slim
    container_name: cortex_mcp_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../apps/cortex-mcp:/app
    environment:
      CORTEX_API_BASE_URL: http://bench:8000
      FRAPPE_URL: http://bench:8000
      FRAPPE_API_KEY: ${FRAPPE_API_KEY:-dev_api_key_123}
      FRAPPE_API_SECRET: ${FRAPPE_API_SECRET:-dev_api_secret_456}
      PORT: 3100
    command: ["sh", "-c", "pip install -e . && python -m cortex_mcp.server"]
    depends_on:
      - bench
    networks:
      - internal

# --- Réseaux & Isolation ---
networks:
  public:
    driver: bridge
  internal:
    driver: bridge

# --- Volumes Persistants Locaux ---
volumes:
  mariadb_data:
    driver: local
  valkey_data:
    driver: local
  minio_data:
    driver: local
  bench_sites:
    driver: local
